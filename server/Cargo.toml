[package]
name = "naia-server"
version = "0.26.0"
authors = ["connorcarpenter <connorcarpenter@gmail.com>"]
workspace = ".."
description = "A server that uses either UDP or WebRTC communication to send/receive messages to/from connected clients, and syncs registered Entities/Components to clients to whom they are in-scope."
documentation = "https://docs.rs/naia-server"
homepage = "https://github.com/naia-lib/naia"
repository = "https://github.com/naia-lib/naia"
readme = "../README.md"
keywords = ["webrtc", "udp", "server", "networking", "gamedev"]
categories = ["network-programming", "game-development", "wasm", "web-programming"]
license = "MIT OR Apache-2.0"
edition = "2021"

[badges]
maintenance = { status = "actively-developed" }

[features]
zstd_support = ["naia-shared/zstd_support"]
transport_webrtc = [ "naia-server-socket" ]
transport_udp = [
    "naia-shared/address_validation", "naia-shared/transport_udp",
    "ring", "http", "base64", "url"
]
transport_local = [ "http", "base64", "naia-shared/transport_local" ]
interior_visibility = [ "naia-shared/interior_visibility" ]
test_time = [ "naia-shared/test_time" ]
# MISSION_PIPELINE_API_BOUNDARY G7-3: parked-worker (byte-exact determinism)
# mode for the core pipeline runtime. `build.rs` derives the `workers_active`
# cfg as `not(deterministic)`. Implies `test_time` (the parked path drives the
# sim clock synchronously). Consumers whose output must be deterministic enable
# this (e.g. the bevy adapter's `deterministic` feature forwards to it).
deterministic = [ "test_time" ]
e2e_debug = []
test_utils = [ "naia-shared/test_utils" ]
bench_instrumentation = [ "naia-shared/bench_instrumentation" ]
# Additive, default-off. Enables structured `[F3-DIAG naia/<component>]`
# `eprintln!` traces along the send-side pipeline (scope drain, snapshot
# read, packet emit). No wire-format change; zero impact when off.
# Used by cyberlith's `cargo test ... --features f3_diag` to diagnose
# `match_start::f3_world_entity_assignment`.
f3_diag = []

[dependencies]
parking_lot = "0.12"
crossbeam-channel = "0.5"
naia-shared = { version = "0.26", path = "../shared" }
naia-server-socket = { version = "0.26", path = "../socket/server", optional = true }
cfg-if = { version = "1.0" }
log = { version = "0.4" }
fastrand = { version = "2" }

ring = { version = "0.17", optional = true }
http = { version = "1.2", optional = true }
base64 = { version = "0.13", optional = true }
url = { version = "2.2.2", optional = true }
smol = { version = "2" }