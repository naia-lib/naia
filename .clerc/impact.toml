# Naia's impact selector, inventoried from the 42 public workspace members.
# 131 legs (8 lint floor + 123 test-selected checks); a same-name library
# and binary keep both selectors in the same physical command. Six testless
# demo bins left test selection per Kepler ruling seq 135988 option (b) and
# live in [[cargo_targets.unchecked]]; their bins still compile under clippy
# --workspace --all-targets on the static rung.
# Rung adoption (nydus-kp4-rungs, fleet ladder TESTING.md R0-R3 / ADR 0006):
# every suite check lands on exactly one [[rung]]; 'clerc impact run' is the
# native aggregate. docs/IMPACT.md records scope, feature profiles and the
# qualification route.

