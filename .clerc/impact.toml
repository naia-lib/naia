[cargo_targets]
prefix = "test"

# All declared commands retain defaults. Required features in Cargo metadata
# are added verbatim. The server's cfg(test, test_time) quiet-data regression
# also needs its injected-clock/local-transport profile; active worker tests
# remain enabled because this lib profile does not enable deterministic.
# Real-port server tests explicitly enable their crate-level transport cfgs.
# A Cargo target declaration is an inventory entry, never a test-count claim.

[[cargo_targets.unchecked]]
check = "test:naia-basic-client-demo-mq:naia_basic_client_demo_mq"
reason = "Kepler ruling seq 135988 option (b): testless demo bin, 0 #[test] attributes in demos/basic/client/miniquad/ (final2 leg 2/0 GREEN tests=null is the defect, zero-test gate is not coverage). Out of test selection; the bin still compiles under the static rung (clippy --workspace --all-targets)."

