reason = "Kepler ruling seq 135988 option (b): testless demo bin, 0 #[test] attributes in demos/bevy/server/ (final2 leg 2/4 GREEN tests=null). Out of test selection; the bin still compiles under the static rung."

[[cargo_targets.unchecked]]
check = "test:naia-macroquad-client-demo:naia_macroquad_client_demo"
reason = "Kepler ruling seq 135988 option (b): testless demo bin, 0 #[test] attributes in demos/macroquad/client/ (final2 leg 2/12 key 5679de09 RED on host libasound, final4 fresh-attempt UNKNOWN with 0 tests). Out of test selection; the bin still compiles under the static rung. Kepler seq 135995 also drops its libasound footgun (macroquad default-features = false; quad-alsa-sys/quad-snd gone from Cargo.lock)."

[[cargo_targets.unchecked]]
