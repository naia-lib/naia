# The public-path invariant reads every member manifest, not just tools/ci.
[[scan]]
check = "lint:public-paths"
paths = ["Cargo.toml", "**/Cargo.toml"]

# Changes to selector/build policy conservatively select the whole suite.
[[root]]
path = ".clerc/"
mode = "fallback"
reason = "The selector and physical argv change the meaning of every check."

[[root]]
path = ".cargo/"
mode = "fallback"
reason = "Cargo configuration can change compilation and test execution."

[[root]]
path = "Cargo.toml"
mode = "cargo-workspace"
reason = "Resolve workspace dependency/profile changes through Cargo manifests; undecidable changes fall back."

[[root]]
path = "Cargo.lock"
mode = "fallback"
reason = "Tracked since 3b7d8035: the resolved dependency graph changes what every check builds and links against; conservatively select the whole suite."

[[root]]
path = "rust-toolchain.toml"
mode = "fallback"
reason = "The toolchain changes the meaning of every check."

[[root]]
path = "siblings.lock"
mode = "fallback"
reason = "Sibling pins change what the build resolves; conservatively select the whole suite."

[[root]]
path = "AGENTS.md"
mode = "scan-only"
reason = "Agent doctrine, not build input."

[[root]]
path = "deny.toml"
mode = "fallback"
reason = "Dependency policy changes can affect every package."

[[root]]
path = "rustfmt.yml"
mode = "fallback"
reason = "Formatter policy changes affect the full Rust file set."

[[root]]
path = "crucible.toml"
mode = "fallback"
reason = "Test infrastructure configuration can affect selection and execution."

[[root]]
path = ".github/"
mode = "scan-only"
reason = "Funding metadata; this repository declares no GitHub Actions selector."

[[root]]
path = ".gitignore"
mode = "scan-only"
reason = "Ignored output patterns; R0 remains mandatory."

[[root]]
path = ".gitpod.yml"
mode = "scan-only"
reason = "Development environment metadata; R0 remains mandatory."

[[root]]
path = ".idea/"
mode = "scan-only"
reason = "Editor metadata; R0 remains mandatory."

[[root]]
path = ".nojekyll"
mode = "scan-only"
reason = "Documentation hosting marker."

[[root]]
path = ".tesaki/"
mode = "scan-only"
reason = "Scenario authoring configuration outside the public Cargo workspace."

[[root]]
path = "CHANGELOG.md"
mode = "scan-only"
reason = "Release notes, not a runtime or test input."

[[root]]
path = "FEATURES.md"
mode = "scan-only"
reason = "Feature documentation, not a compiled fixture."

[[root]]
path = "LICENSE-APACHE.txt"
mode = "scan-only"
reason = "License text."

[[root]]
path = "LICENSE-MIT.txt"
mode = "scan-only"
reason = "License text."

[[root]]
path = "README.md"
mode = "scan-only"
reason = "Repository documentation; Cargo includes it as package metadata."

[[root]]
path = "SECURITY.md"
mode = "scan-only"
reason = "Security reporting documentation."

[[root]]
path = "_AGENTS/"
mode = "scan-only"
reason = "Architecture, historical plans and operational documentation."

[[root]]
path = "book/"
mode = "scan-only"
reason = "Published book sources, not Rust test fixtures."

[[root]]
path = "docs/"
mode = "scan-only"
reason = "Repository documentation; no test target reads these files as fixtures."

[[root]]
path = "faq/"
mode = "scan-only"
reason = "Published FAQ sources."

[[root]]
path = "rust-analyzer.toml"
mode = "scan-only"
reason = "Editor analysis configuration."

# ---------------------------------------------------------------------------
# R0 — static floor (TESTING.md ladder R0): no execution. Covers the suite
# floor: file-set formatting (verify-fmt-fileset is the maintained R0
# formatter command per docs/IMPACT.md), strict workspace Clippy, native
# warning-clean checking, the public-path invariant, and all four
# existing Wasm profiles.
[[rung]]
level = 0
checks = [
    "lint:fmt",
    "lint:clippy",
    "lint:native-check",
    "lint:public-paths",
    "lint:wasm-shared",
    "lint:wasm-client",
    "lint:wasm-bevy-client",
    "lint:wasm-mquad",
]
budget_minutes = 60

