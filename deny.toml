# cargo-deny configuration for naia.
#
# Schema: v2 (https://embarkstudios.github.io/cargo-deny/checks/cfg.html)
#
# 2026-08-27: the webrtc-unreliable-client DTLS/HTTP migration landed
# (security/slimdown: legacy rustls 0.19 / webpki 0.21 / ring 0.16 closure
# removed, reqwest replaced by a hand-rolled signaling POST, RustCrypto stack
# unified). All ignore entries that were time-boxed to that migration have been
# deleted. The remaining entries are re-triaged below with their own reasons.

[advisories]
version = 2
yanked = "deny"

ignore = [
    # ---- smol/fastrand chain via naia-server ----
    { id = "RUSTSEC-2024-0384", reason = "instant unmaintained. Via fastrand 1.x -> futures-lite -> async-fs -> smol 1.3.0 -> naia-server. Resolved when smol bumps fastrand to 2.x." },

    # ---- demo crates only (not in published library) ----
    { id = "RUSTSEC-2025-0035", reason = "macroquad unsound. Demo crate only (demos/macroquad). Not in published library crates." },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained. Via fontdue -> macroquad demo crates only. Not in published library crates." },
]

[licenses]
version = 2
# Broad allow list mirroring pre-v2 `allow-osi-fsf-free = "either"` intent.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "OpenSSL",
    "BlueOak-1.0.0", # synthez (proc-macro helper) — permissive
    "MPL-2.0",       # webpki-roots (TLS roots) — only in webrtc-unreliable-client tree
]


[[licenses.clarify]]
name = "stretch"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
