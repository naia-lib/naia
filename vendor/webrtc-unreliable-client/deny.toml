# cargo-deny configuration for webrtc-unreliable-client.
#
# Policy (2026-08-27): keep this tree advisory-clean so downstream naia never
# inherits findings from here. No ignore entries — fix forward instead.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Only licenses actually present in the dependency graph are listed. cargo-deny
# warns on unmatched allowances, and per the no-ignores policy we fix forward:
# if a new dependency needs another license, add it then, deliberately.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# tests/loopback.rs consumes naia-server-socket from naia dev.
allow-git = ["https://github.com/naia-lib/naia"]
