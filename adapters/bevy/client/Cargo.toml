[package]
name = "naia-bevy-client"
version = "0.26.0"
authors = ["connorcarpenter <connorcarpenter@gmail.com>"]
workspace = "../../.."
description = "Library to faciliate naia_client & Bevy interop"
homepage = "https://github.com/naia-lib/naia"
repository = "https://github.com/naia-lib/naia"
license = "MIT OR Apache-2.0"
edition = "2021"

[badges]
maintenance = { status = "actively-developed" }

[features]
transport_webrtc = [ "naia-client/transport_webrtc" ]
transport_udp = [ "naia-client/transport_udp" ]
transport_local = [ "naia-client/transport_local" ]
interior_visibility = [ "naia-client/interior_visibility" ]
test_time = [ "naia-client/test_time", "naia-bevy-shared/test_time" ]

[dependencies]
parking_lot = "0.12"
naia-client = { version = "0.26", path = "../../../client", features = ["wbindgen"] }
naia-bevy-shared = { version = "0.26", path = "../shared" }
naia-bevy-derive = { version = "0.26", path = "../derive" }
naia-derive = { version = "0.26", path = "../../../shared/derive" }
bevy_app = { version = "0.19", default-features=false }
bevy_ecs = { version = "0.19", default-features=false }
log = { version = "0.4" }