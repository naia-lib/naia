[package]
name = "naia-bevy-server"
version = "0.25.0"
authors = ["connorcarpenter <connorcarpenter@gmail.com>"]
workspace = "../../.."
description = "Library to faciliate naia_server & Bevy interop"
homepage = "https://github.com/naia-lib/naia"
repository = "https://github.com/naia-lib/naia"
license = "MIT OR Apache-2.0"
edition = "2021"

[badges]
maintenance = { status = "actively-developed" }

[features]
transport_webrtc = [ "naia-server/transport_webrtc" ]
transport_udp = [ "naia-server/transport_udp" ]
transport_local = [ "naia-server/transport_local" ]
# `test_time` means ONLY "advanceable clock" (TestClock backs the time
# manager). It no longer implies parked workers — that is now `deterministic`.
test_time = [ "naia-server/test_time", "naia-bevy-shared/test_time" ]
# Forces the Recv/Send worker loops into their parking-service path and the
# consumer to drive recv/send synchronously inside the park window — i.e. the
# fully-serialized, reproducible-output execution the E2E/sim suite relies on.
# Implies `test_time` (the synchronous park-window drive needs the controllable
# clock). The parked-vs-active choice is centralized in `build.rs` as the
# `workers_active` cfg = `not(deterministic)`. With `test_time` ON but
# `deterministic` OFF (a bench), the same advanceable clock runs with ACTIVE
# workers, so a driver can measure real 3-stage thread overlap under a
# saturated simulated clock. This split is fail-OPEN: builds that need
# deterministic output MUST enable this (e.g. `cyberlith_test_harness` enables
# it by default).
deterministic = [ "test_time" ]
# Bench-only cross-thread per-stage timing aggregator (see `pipeline_timing.rs`).
# Zero-cost when off.
pipeline_timing = []
interior_visibility = [ "naia-server/interior_visibility" ]
bench_instrumentation = [ "naia-server/bench_instrumentation" ]
# Additive, default-off. Cascades to `naia-server/f3_diag` — see that
# crate's `[features]` for details.
f3_diag = [ "naia-server/f3_diag" ]

[dependencies]
parking_lot = "0.12"
crossbeam-channel = "0.5"
# Event-driven recv: the recv worker awaits a `future::or` over the
# transport readiness signal + a control wake signal, both smol channels.
smol = "1.3"
naia-server = { version = "0.25", path = "../../../server", features = ["bevy_support"] }
naia-bevy-shared = { version = "0.25", path = "../shared" }
bevy_app = { version = "0.18", default-features=false }
bevy_ecs = { version = "0.18", default-features=false }
log = { version = "0.4" }

[dev-dependencies]
# `deterministic` (not just `test_time`) so the integration tests keep the
# parked-worker / synchronous-drive behavior they were written against. Feature
# unification forces it on for the whole crate-under-test (see
# `memory/feedback_naia_bevy_server_test_time_unification.md`).
naia-bevy-server = { path = ".", features = ["transport_local", "deterministic"] }
naia-bevy-client = { path = "../client", features = ["transport_local", "test_time"] }
naia-bevy-shared = { path = "../shared", features = ["test_time"] }
naia-server = { path = "../../../server", features = ["bevy_support", "transport_local", "test_time", "test_utils"] }
naia-client = { path = "../../../client", features = ["bevy_support", "transport_local", "test_time"] }
naia-shared = { path = "../../../shared", features = ["bevy_support", "transport_local", "test_time", "test_utils"] }
naia-test-harness = { path = "../../../test/harness" }
parking_lot = "0.12"