# Tesaki configuration for Naia
# This config file enables `tesaki run` with zero flags

# Path to specs directory (relative to this config's directory, which is the naia repo root)
specs_dir = "test/specs"

# Adapter command to run the NPA test adapter.
# Uses run_npa.sh instead of `cargo run` directly: on warm builds (nothing
# changed) this completes in < 0.5s; only cold builds pay the full compile
# cost once per session. See test/npa/run_npa.sh for details.
adapter_cmd = "bash test/npa/run_npa.sh"

# Primary agent (applies to both runner + planner)
agent = "copilot"

# Budget limits
max_retries = 0
max_cert_updates = 3
max_runtime_seconds = 600
max_files_changed = 10
