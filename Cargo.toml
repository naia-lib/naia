[workspace]
resolver = "2"
members = [
    "client",
    "server",
    "shared",
    "metrics",
    "shared/derive",
    "shared/derive_core",
    "shared/serde",
    "shared/serde/derive",
    "shared/serde/derive_core",
    "socket/client",
    "socket/server",
    "socket/shared",
    "bench/criterion",
    # "bench/iai",  -- disabled until iai-callgrind-runner is installed in CI/PATH; see _AGENTS/SDD_MIGRATION_PLAN.md Track 3
    "tools/spec_tool",
    "test/compile_fail",
    "test/harness",
    "test/loom",
    "adapters/bevy/client",
    "adapters/bevy/derive",
    "adapters/bevy/server",
    "adapters/bevy/shared",
    "adapters/bevy/metrics",
    "demos/demo_utils/demo_world",
    "demos/demo_utils/empty_world",
    "demos/basic/server",
    "demos/basic/shared",
    "demos/basic/client/app",
    "demos/basic/client/wasm_bindgen",
    "demos/basic/client/miniquad",
    "demos/bevy/server",
    "demos/bevy/shared",
    "demos/bevy/client",
    "demos/macroquad/server",
    "demos/macroquad/shared",
    "demos/macroquad/client",
    "demos/socket/server",
    "demos/socket/shared",
    "demos/socket/client/app",
    "demos/socket/client/wasm_bindgen",
    "demos/socket/client/miniquad",
]
# Connor ruling 2026-09-17 (Kepler seq9606): sibling path dependencies are for
# development checkouts only and must never reach `dev` or `main` — naia is
# public, and external consumers clone it with no siblings present. These
# crates depend on private siblings (namako, slag), so they are excluded from
# the published workspace. In a full sibling checkout they still build via
# `cargo build --manifest-path <crate>/Cargo.toml`. Guarded by
# tools/ci/check_no_escaping_path_deps.py (GitHub Actions is disabled in
# this repo — run it by hand or from self-hosted CI).
exclude = [
    "bench/wins",
    "bench/suite",
    "test/npa",
    "test/bevy_npa",
    "test/tests",
]
# Do not put demos in the default-members, since they may use conflicting dependencies / feature flags
default-members = [
    "client",
    "server",
    "shared",
    "shared/derive",
    "shared/derive_core",
    "shared/serde",
    "shared/serde/derive",
    "shared/serde/derive_core",
    "socket/client",
    "socket/server",
    "socket/shared",
    "adapters/bevy/client",
    "adapters/bevy/derive",
    "adapters/bevy/server",
    "adapters/bevy/shared",
]

[profile.release]
opt-level = 's'
lto = true
