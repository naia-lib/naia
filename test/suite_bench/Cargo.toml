[package]
name = "naia-suite-bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Wall-clock timing benchmark for the naia BDD suite. Measures per-scenario execution time to establish baseline before and after parallelism optimizations."

[[bin]]
name = "naia_suite_bench"
path = "src/main.rs"

[dependencies]
# Same deps as naia-npa — this binary runs the full plan with timing instrumentation
namako_engine = { path = "../../../namako/engine", features = ["npap", "macros"] }
naia-tests = { path = "../tests" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
futures = "0.3"
regex = "1"
rayon = "1"
