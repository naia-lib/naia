[package]
name = "naia-derive-core"
version = "0.25.0"
authors = ["connorcarpenter <connorcarpenter@gmail.com>"]
workspace = "../.."
description = "Shared proc-macro impl logic for naia derive crates (no adapter/facade names)"
homepage = "https://github.com/naia-lib/naia"
repository = "https://github.com/naia-lib/naia"
license = "MIT OR Apache-2.0"
edition = "2021"

[badges]
maintenance = { status = "actively-developed" }

[features]
bevy_support = []

[dependencies]
proc-macro2 = "1.0"
syn = { version = "2.0.29", features = ["clone-impls"] }
quote = "1.0"
